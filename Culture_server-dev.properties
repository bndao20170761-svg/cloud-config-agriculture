# Configuration pour gestion-culture-server
spring.application.name=gestion-culture-server
server.port=8071

# Configuration Base de Données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/culture_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate pour MySQL  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Configuration Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuration JWT - NOMS CORRECTS
agri.app.jwtSecret=hF9IsSdyj/KnkZiAJsAnwKsf4rJombf3MAX4pZFBzql8WQyPFy8gVSGxUyTaT3m4gE9yG+i1KGz5BpP5k8+jgg==
agri.app.jwtExpirationMs=3600000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.agri.inov.sn.Gestion_Culture_server=DEBUG
