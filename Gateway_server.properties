spring.cloud.gateway.routes[15].id=agriculture-alertes-service
spring.cloud.gateway.routes[15].uri=lb://AGRICULTURE-USER
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/alertes/**

# Configuration CORS globale
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:9191,http://127.0.0.1:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,Origin
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# Configuration de logs pour debug
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

