# Port du serveur
server.port=9191

# Activation de la découverte automatique des routes via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# Routes pour Agriculture_User microservice
spring.cloud.gateway.routes[0].id=agriculture-auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=agriculture-user-service
spring.cloud.gateway.routes[1].uri=lb://AGRICULTURE-USER
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/user/**

# Routes pour Gestion_Culture_server (HUB - Consolidé)
spring.cloud.gateway.routes[2].id=agriculture-culture-service
spring.cloud.gateway.routes[2].uri=lb://GESTION-CULTURE-SERVER
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cultures/**

# Routes pour Parcelles (maintenant dans Gestion_Culture_server)
spring.cloud.gateway.routes[3].id=agriculture-parcelle-service
spring.cloud.gateway.routes[3].uri=lb://GESTION-CULTURE-SERVER
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/parcelles/**

# Routes pour Recoltes (maintenant dans Gestion_Culture_server)
spring.cloud.gateway.routes[4].id=agriculture-recolte-service
spring.cloud.gateway.routes[4].uri=lb://GESTION-CULTURE-SERVER
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/recoltes/**

# Routes pour Semences (maintenant dans Gestion_Culture_server)
spring.cloud.gateway.routes[5].id=agriculture-semence-service
spring.cloud.gateway.routes[5].uri=lb://GESTION-CULTURE-SERVER
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/semences/**

spring.cloud.gateway.routes[6].id=agriculture-profile-service
spring.cloud.gateway.routes[6].uri=lb://AGRICULTURE-USER
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/profiles/**



# Routes pour le service IA Prediction
spring.cloud.gateway.routes[7].id=agriculture-ia-service
spring.cloud.gateway.routes[7].uri=http://localhost:8095
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/diagnostics/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1


# Routes pour le service Profile individuel (via Agriculture_User)
spring.cloud.gateway.routes[8].id=agriculture-profile-individual-service
spring.cloud.gateway.routes[8].uri=lb://AGRICULTURE-USER
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/profile/**

# Routes manquantes - Services non consolidés dans Gestion_Culture_server
# Prêts, Subventions, Assistances, Forum, Marketplace, Statistiques, Alertes
spring.cloud.gateway.routes[9].id=agriculture-prets-service
spring.cloud.gateway.routes[9].uri=lb://AGRICULTURE-USER
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/prets/**

