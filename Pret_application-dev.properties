spring.application.name=Gestion_Pret_server
server.port=8083

spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.enabled=true
spring.cloud.config.import-check.enabled=false

# MySQL - meme base que les autres services
spring.datasource.url=jdbc:mysql://localhost:3306/agriculture_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT - meme secret que Agriculture_User pour valider les tokens
agri.app.jwtSecret=hF9IsSdyj/KnkZiAJsAnwKsf4rJombf3MAX4pZFBzql8WQyPFy8gVSGxUyTaT3m4gE9yG+i1KGz5BpP5k8+jgg==
agri.app.jwtExpirationMs=3600000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logs
logging.level.com.netflix.discovery=WARN
logging.level.com.zaxxer.hikari=ERROR
