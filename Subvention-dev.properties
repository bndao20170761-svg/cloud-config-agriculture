# Configuration Cloud Config
spring.application.name=Subvention
server.port=8087
# MarketPlace-dev.properties — Cloud Config GitHub

# Configuration MongoDB
spring.data.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:admin123}@localhost:27017/subvention_db?authSource=admin
spring.data.mongodb.database=subvention_db

# Configuration Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# JWT configuration — 24 heures
app.jwt.secret=hF9IsSdyj/KnkZiAJsAnwKsf4rJombf3MAX4pZFBzql8WQyPFy8gVSGxUyTaT3m4gE9yG+i1KGz5BpP5k8+jgg==
app.jwt.expiration=86400000

# Configuration Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Desactiver la verification de compatibilite Spring Cloud
spring.cloud.compatibility-verifier.enabled=false


